name: Daily fire news

on:
  schedule:
    - cron: "13 9 * * *"   # every day, about 5 AM Eastern
  workflow_dispatch:        # lets you run it by hand from the Actions tab

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install feedparser
      - run: python scripts/fetch_news.py
      - name: Save today's news
        run: |
          git config user.name "fire-news-bot"
          git config user.email "fire-news-bot@users.noreply.github.com"
          git add docs/news.json
          git diff --cached --quiet || git commit -m "Daily news update $(date -u +%F)"
          git push
