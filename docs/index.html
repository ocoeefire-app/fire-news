<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Fire Service Daily</title>
<meta name="description" content="Fire service news, research and publications, updated every morning.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Oswald:wght@500;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #f4f2ef; --card: #ffffff; --ink: #1c1b1a; --muted: #6b6662;
    --line: #e2ddd7; --red: #b3121b; --red-soft: #fbe9e9; --chip: #ebe7e2;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: #121110; --card: #1c1a19; --ink: #f1eeea; --muted: #a49d96;
      --line: #2e2b29; --red: #e8414a; --red-soft: #3a1b1d; --chip: #2a2725;
    }
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--ink);
         font: 15px/1.5 Inter, system-ui, sans-serif; }
  header { background: #161514; color: #fff; border-bottom: 4px solid var(--red); }
  .wrap { max-width: 1100px; margin: 0 auto; padding: 0 16px; }
  .top { display: flex; align-items: center; justify-content: space-between;
         gap: 12px; padding: 22px 0 18px; flex-wrap: wrap; }
  h1 { font: 700 30px/1 Oswald, sans-serif; letter-spacing: .5px; margin: 0;
       text-transform: uppercase; }
  h1 span { color: #ff4d55; }
  .updated { color: #bdb6ae; font-size: 13px; }
  .controls { position: sticky; top: 0; z-index: 5; background: var(--bg);
              border-bottom: 1px solid var(--line); padding: 12px 0; }
  .search { width: 100%; padding: 11px 14px; font: inherit; color: var(--ink);
            background: var(--card); border: 1px solid var(--line); border-radius: 8px; }
  .search:focus { outline: 2px solid var(--red); border-color: transparent; }
  .chips { display: flex; gap: 8px; overflow-x: auto; padding-top: 10px;
           scrollbar-width: none; }
  .chip { flex: none; border: 0; cursor: pointer; font: 600 13px Inter, sans-serif;
          padding: 7px 13px; border-radius: 999px; background: var(--chip); color: var(--ink); }
  .chip[aria-pressed="true"] { background: var(--red); color: #fff; }
  .chip small { opacity: .7; font-weight: 500; margin-left: 3px; }
  main { padding: 20px 0 50px; }
  .day { font: 500 14px Oswald, sans-serif; text-transform: uppercase; letter-spacing: 1px;
         color: var(--muted); margin: 22px 0 10px; }
  .grid { display: grid; gap: 12px; grid-template-columns: repeat(auto-fill, minmax(300px, 1fr)); }
  .card { display: flex; flex-direction: column; gap: 6px; padding: 16px;
          background: var(--card); border: 1px solid var(--line); border-radius: 10px;
          text-decoration: none; color: inherit; transition: border-color .15s, transform .15s; }
  .card:hover { border-color: var(--red); transform: translateY(-1px); }
  .meta { display: flex; gap: 8px; align-items: center; font-size: 12px; color: var(--muted); }
  .tag { font-weight: 600; color: var(--red); background: var(--red-soft);
         padding: 2px 8px; border-radius: 4px; }
  .card h2 { font-size: 16px; line-height: 1.35; margin: 2px 0 0; font-weight: 600; }
  .card p { margin: 0; color: var(--muted); font-size: 14px; }
  .empty { text-align: center; color: var(--muted); padding: 60px 0; }
  footer { border-top: 1px solid var(--line); padding: 18px 0 30px; color: var(--muted); font-size: 12px; }
  .tabs { display: flex; gap: 4px; overflow-x: auto; scrollbar-width: none; }
  .tab { flex: none; background: none; border: 0; cursor: pointer; color: #bdb6ae;
         font: 500 15px Oswald, sans-serif; letter-spacing: .6px; text-transform: uppercase;
         padding: 10px 14px 12px; border-bottom: 3px solid transparent; margin-bottom: -4px; }
  .tab[aria-selected="true"] { color: #fff; border-bottom-color: #ff4d55; }
  .intro { color: var(--muted); font-size: 14px; margin: 0 0 6px; max-width: 760px; }
  .cols { display: grid; gap: 14px; grid-template-columns: repeat(3, 1fr); margin-top: 14px; }
  .col h3 { font: 500 16px Oswald, sans-serif; text-transform: uppercase; letter-spacing: .6px;
            margin: 0 0 10px; display: flex; align-items: center; gap: 8px; }
  .count { font: 700 13px Inter, sans-serif; color: #fff; border-radius: 999px; padding: 1px 9px; }
  .s-on .count { background: #1f7a3a; } .s-staffing .count { background: #c77800; } .s-talks .count { background: #49617a; }
  .dept { background: var(--card); border: 1px solid var(--line); border-left-width: 4px;
          border-radius: 8px; padding: 12px 14px; margin-bottom: 10px; }
  .s-on .dept { border-left-color: #1f7a3a; } .s-staffing .dept { border-left-color: #c77800; } .s-talks .dept { border-left-color: #49617a; }
  .dept b { display: block; font-size: 15px; } .dept .rg { font-size: 12px; color: var(--muted); }
  .dept p { margin: 6px 0 4px; font-size: 13.5px; }
  .dept a { font-size: 12px; color: var(--red); }
  @media (max-width: 860px) { .cols { grid-template-columns: 1fr; } }
  @media (max-width: 520px) { h1 { font-size: 24px; } .grid { grid-template-columns: 1fr; } }
</style>
</head>
<body>
<header>
  <div class="wrap top">
    <h1>Fire Service <span>Daily</span></h1>
    <div class="updated" id="updated">Loading…</div>
  </div>
  <nav class="wrap tabs" role="tablist">
    <button class="tab" role="tab" data-t="news">Fire News</button>
    <button class="tab" role="tab" data-t="union">Union</button>
    <button class="tab" role="tab" data-t="shift">24/72 Tracker</button>
  </nav>
</header>

<div class="controls">
  <div class="wrap">
    <input class="search" id="q" type="search" placeholder="Search headlines…" aria-label="Search headlines">
    <div class="chips" id="chips"></div>
  </div>
</div>

<main class="wrap" id="list"></main>

<footer class="wrap">
  Headlines link to the original publishers. Updated automatically every morning.
  <span id="srcs"></span>
</footer>

<script src="app.js"></script>
</body>
</html>
